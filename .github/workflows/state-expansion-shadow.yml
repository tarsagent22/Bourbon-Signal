name: Read-only immutable fleet cache replay
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: readonly-fleet-cache-replay
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix engine
      - name: Restore exact immutable collector cache without saving
        id: collector
        uses: actions/cache/restore@v4
        with:
          path: |
            engine/out/browser
            engine/out/cache
            engine/out/states
            engine/out/snapshots
            engine/out/history/snapshots
            engine/out/location-bible-official.json
            engine/out/site-refresh-status.json
            engine/out/optimization/source-run-history.json
            engine/out/optimization/georgia-retailer-activation.json
            engine/out/optimization/state-run-metrics.json
          key: inventory-collector-state-Linux-40907316461
          fail-on-cache-miss: true
      - name: Restore exact last-published input without saving
        id: published
        uses: actions/cache/restore@v4
        with:
          path: engine/out/site
          key: inventory-published-site-Linux-40897791021
          fail-on-cache-miss: true
      - name: Read immutable capture and its original implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/replay-fleet-cache.mjs --prepare
          legacy_sha=$(gh api repos/${{ github.repository }}/actions/runs/40907316461 --jq .head_sha)
          git worktree add --detach "$RUNNER_TEMP/fleet-legacy" "$legacy_sha"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/fleet-legacy/node_modules"
          ln -s "$GITHUB_WORKSPACE/engine/node_modules" "$RUNNER_TEMP/fleet-legacy/engine/node_modules"
          echo "FLEET_LEGACY_ROOT=$RUNNER_TEMP/fleet-legacy" >> "$GITHUB_ENV"
          echo "FLEET_LEGACY_SHA=$legacy_sha" >> "$GITHUB_ENV"
      - name: Replay cached source rows only; no collector or publisher
        env:
          FLEET_COLLECTOR_CACHE_EXACT: ${{ steps.collector.outputs.cache-hit }}
          FLEET_PUBLISHED_CACHE_EXACT: ${{ steps.published.outputs.cache-hit }}
        run: node --expose-gc --max-old-space-size=12288 scripts/replay-fleet-cache.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readonly-fleet-replay-${{ github.run_id }}
          path: engine/out/fleet-replay/summary.json
          if-no-files-found: warn
