name: Rotating state expansion shadow collection

on:
  schedule:
    # Six evenly spaced UTC runs/day; the 05:15 UTC run lands in the Eastern early-morning batch during DST.
    - cron: "15 1,5,9,13,17,21 * * *"
  workflow_dispatch:
    inputs:
      states:
        description: "Optional comma-separated shadowEligible non-active state IDs"
        required: false
        default: ""
      limit:
        description: "Maximum eligible states to collect"
        required: false
        default: "5"
      renew_active_states:
        description: "Manual research renewal only: explicit reviewed WA,NM,WI,OK subset, also included in states"
        required: false
        default: ""

concurrency:
  group: ${{ inputs.renew_active_states != '' && 'production-inventory-refresh' || 'state-expansion-shadow' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  collect-shadow-evidence:
    if: ${{ inputs.renew_active_states != '' || (inputs.states != 'NJ,MI' && inputs.states != 'NJ' && inputs.states != 'MI') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BOURBON_SIGNAL_AUTO_DEPLOY: "0"
      BOURBON_SIGNAL_ALERT_QUEUE_MODE: shadow
      ALERT_DELIVERY_ENABLED: "0"
      ALERT_ONSITE_DELIVERY_ENABLED: "0"
      ALERT_EMAIL_DELIVERY_ENABLED: "0"
      ALERT_SMS_DELIVERY_ENABLED: "0"
      BOURBON_SIGNAL_SKIP_BROWSER_COLLECTORS: "0"
      BROWSER_HEADLESS: "1"
      BOURBON_SIGNAL_LIBRARY_CATALOG_FILE: out/library-catalog.json
      BOURBON_SIGNAL_OR_BROWSER_PREREQUISITE_TIMEOUT_MS: "180000"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install engine dependencies
        run: npm ci --prefix engine

      - uses: actions/cache/restore@v4
        id: research-cache
        with:
          path: |
            engine/out/research-source-attempts
            engine/out/cache/library-search
          key: research-shadow-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            research-shadow-${{ runner.os }}-${{ github.ref_name }}-
            research-shadow-${{ runner.os }}-

      - name: Restore active-four research incidents across proof branches
        uses: actions/cache/restore@v4
        with:
          path: |
            engine/out/research-source-attempts/grocery-WA.json
            engine/out/research-source-attempts/grocery-NM.json
            engine/out/research-source-attempts/WI.json
            engine/out/research-source-attempts/OK.json
            engine/out/research-source-attempts/central-cityhive-journals
            engine/out/research-source-attempts/active-renewal-journals
          key: active-four-research-incidents-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: active-four-research-incidents-${{ runner.os }}-

      - name: Restore production WA NM holds before manual research renewal
        if: ${{ inputs.renew_active_states != '' }}
        uses: actions/cache/restore@v4
        with:
          path: engine/out/source-incidents/western-grocery
          key: inventory-western-grocery-incidents-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: inventory-western-grocery-incidents-${{ runner.os }}-

      - name: Restore production WI OK holds before manual research renewal
        if: ${{ inputs.renew_active_states != '' }}
        uses: actions/cache/restore@v4
        with:
          path: engine/out/source-incidents/central-cityhive
          key: inventory-central-cityhive-incidents-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: inventory-central-cityhive-incidents-${{ runner.os }}-

      - name: Restore NJ MI host incidents for every shadow selection path
        uses: actions/cache/restore@v4
        with:
          path: engine/out/research-source-attempts/nj-mi-incidents.json
          key: nj-mi-research-incidents-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nj-mi-research-incidents-${{ runner.os }}-

      - name: Restore LA AK host incidents independently of research branch
        uses: actions/cache/restore@v4
        with:
          path: engine/out/research-source-attempts/louisiana-alaska-grocery-journals
          key: la-ak-research-incidents-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            la-ak-research-incidents-${{ runner.os }}-

      - name: Restore New England incidents independently of research branch
        uses: actions/cache/restore@v4
        with:
          path: engine/out/source-incidents/new-england-cityhive
          key: new-england-source-incidents-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            new-england-source-incidents-${{ runner.os }}-

      - name: Refresh full current app catalog
        working-directory: engine
        run: npm run sync:library

      - name: Generate deterministic Bourbon Bible
        working-directory: engine
        run: npm run bible

      - name: Validate manual shadow inputs
        id: validate
        shell: bash
        env:
          RAW_STATES: ${{ inputs.states || '' }}
          RAW_LIMIT: ${{ inputs.limit || '5' }}
          RAW_RENEWAL: ${{ inputs.renew_active_states || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ -n "$RAW_STATES" && ! "$RAW_STATES" =~ ^[A-Z]{2}(-[A-Z0-9]+)?(,[A-Z]{2}(-[A-Z0-9]+)?)*$ ]]; then
            echo "states must be a comma-separated list of uppercase state IDs" >&2
            exit 1
          fi
          MAX_LIMIT=5
          if [[ -n "$RAW_RENEWAL" ]]; then
            if [[ "$EVENT_NAME" != workflow_dispatch || ! "$RAW_RENEWAL" =~ ^(WA|NM|WI|OK)(,(WA|NM|WI|OK))*$ || -z "$RAW_STATES" ]]; then
              echo "renewal requires manual workflow_dispatch, explicit states and the reviewed active-four IDs" >&2
              exit 1
            fi
            MAX_LIMIT=9
            # Runtime reads GitHub's actual workflow state and queues before
            # collection: refresh-feed.yml must be disabled_manually and idle.
            # Root keeps it disabled until every research incident is reviewed.
          fi
          if [[ ! "$RAW_LIMIT" =~ ^[1-9]$ || "$RAW_LIMIT" -gt "$MAX_LIMIT" ]]; then
            echo "limit must be 1..5, or 1..9 for explicit manual active renewal" >&2
            exit 1
          fi
          echo "states=$RAW_STATES" >> "$GITHUB_OUTPUT"
          echo "limit=$RAW_LIMIT" >> "$GITHUB_OUTPUT"
          echo "renewal=$RAW_RENEWAL" >> "$GITHUB_OUTPUT"

      - name: Collect bounded shadow evidence only
        working-directory: engine
        env:
          STATES: ${{ steps.validate.outputs.states }}
          LIMIT: ${{ steps.validate.outputs.limit }}
          RENEWAL: ${{ steps.validate.outputs.renewal }}
        run: npm run shadow:expansion -- --states="$STATES" --limit="$LIMIT" --renew-active-states="$RENEWAL"

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            engine/out/research-source-attempts
            engine/out/cache/library-search
          key: research-shadow-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Save active-four research incidents even after abort or incomplete proof
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            engine/out/research-source-attempts/grocery-WA.json
            engine/out/research-source-attempts/grocery-NM.json
            engine/out/research-source-attempts/WI.json
            engine/out/research-source-attempts/OK.json
            engine/out/research-source-attempts/central-cityhive-journals
            engine/out/research-source-attempts/active-renewal-journals
          key: active-four-research-incidents-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save NJ MI host incidents for every shadow selection path
        if: always()
        uses: actions/cache/save@v4
        with:
          path: engine/out/research-source-attempts/nj-mi-incidents.json
          key: nj-mi-research-incidents-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save LA AK host incidents even on incomplete source proof
        if: always()
        uses: actions/cache/save@v4
        with:
          path: engine/out/research-source-attempts/louisiana-alaska-grocery-journals
          key: la-ak-research-incidents-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save New England incidents even when research fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: engine/out/source-incidents/new-england-cityhive
          key: new-england-source-incidents-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve exact New England family and current library inputs
        if: always() && hashFiles('engine/out/new-england-research/**/report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: new-england-research-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            engine/out/new-england-research
            engine/out/bourbon-bible.json
            engine/out/library-catalog.json

      - name: Preserve isolated shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-expansion-shadow-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: engine/out/shadow

      - name: Preserve renewal incident-only evidence for reviewed main-scope handoff
        if: always() && inputs.renew_active_states != ''
        uses: actions/upload-artifact@v4
        with:
          name: active-four-research-incidents-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            engine/out/research-source-attempts/active-renewal-journals
            engine/out/research-source-attempts/central-cityhive-journals
            engine/out/research-source-attempts/grocery-WA.json
            engine/out/research-source-attempts/grocery-NM.json
            engine/out/research-source-attempts/WI.json
            engine/out/research-source-attempts/OK.json
            engine/out/research-source-attempts/louisiana-alaska-grocery-journals
            engine/out/source-incidents

  collect-nj-mi-research:
    if: ${{ inputs.renew_active_states == '' && (inputs.states == 'NJ,MI' || inputs.states == 'NJ' || inputs.states == 'MI') }}
    uses: ./.github/workflows/nj-mi-research-preflight.yml
    with:
      states: ${{ inputs.states }}
