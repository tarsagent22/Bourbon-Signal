name: Production app-storage migration

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit to migrate
        required: true
        type: string
      confirmation:
        description: Type APPLY_APP_STORAGE_MIGRATION
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-app-storage-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'APPLY_APP_STORAGE_MIGRATION' }}
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify pinned main commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Apply and verify app-storage schema
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          npx --yes vercel@59.1.4 env run -e production --project bourbonsignal --scope tarsagent22s-projects --token "$VERCEL_TOKEN" -- npm run migrate:app-storage:apply
          npx --yes vercel@59.1.4 env run -e production --project bourbonsignal --scope tarsagent22s-projects --token "$VERCEL_TOKEN" -- npm run migrate:app-storage
