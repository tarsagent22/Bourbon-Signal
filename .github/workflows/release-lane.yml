name: Single release lane

on:
  pull_request_target:
    types: [opened, reopened, closed, synchronize, converted_to_draft, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: single-release-lane-status
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout authoritative policy from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reconcile the required status on every open PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-lane.mjs --phase=reconcile-statuses
