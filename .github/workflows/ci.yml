name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: https://bourbonsignal.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix engine

      - name: Verify engine reliability and expansion capacity
        run: npm --prefix engine run verify:reliability

      - name: Verify generated lifecycle configuration has no drift
        run: npm run verify:state-lifecycle-drift

      - name: Reconcile workflow-issued state promotion provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-promotion-provenance.mjs --state=UT --online

      - name: Build and verify
        run: npm run verify:ci

  single-release-lane:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enforce the sole active release PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/verify-release-lane.mjs --phase=ci --pr="$PR_NUMBER"
