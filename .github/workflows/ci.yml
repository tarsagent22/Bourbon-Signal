name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: https://bourbonsignal.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix engine

      - name: Verify engine reliability and expansion capacity
        run: npm --prefix engine run verify:reliability

      - name: Verify generated lifecycle configuration has no drift
        run: npm run verify:state-lifecycle-drift

      - name: Build and verify
        run: npm run verify:ci
