name: Refresh production inventory feed

run-name: ${{ inputs.incident_key != '' && format('Inventory recovery {0}', inputs.incident_key) || 'Production inventory refresh' }}

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force_all_states:
        description: "Disable adaptive scheduling and refresh every active state"
        required: false
        default: "false"
      states:
        description: "Optional comma-separated state ids to refresh"
        required: false
        default: ""
      va_required_store_id:
        description: "Optional Virginia ABC store id that must have fresh customer-visible inventory before targeted VA publication"
        required: false
        default: ""
      incident_key:
        description: "Immutable watchdog incident fingerprint for recovery deduplication"
        required: false
        default: ""

concurrency:
  group: production-inventory-refresh
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  collect-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      BOURBON_SIGNAL_BROWSER_PREFLIGHT: "0"
      BOURBON_SIGNAL_AUTO_DEPLOY: "0"
      BOURBON_SIGNAL_REFRESH_CADENCE_MINUTES: "30"
      BOURBON_SIGNAL_RUN_STEP_TIMEOUT_MS: "1320000"
      BOURBON_SIGNAL_REFRESH_STEP_TIMEOUT_MS: "1500000"
      BOURBON_SIGNAL_FWGS_BROWSER_STEP_TIMEOUT_MS: "1800000"
      FWGS_INVENTORY_CONCURRENCY: "16"
      FWGS_INVENTORY_SKU_BATCH_SIZE: "24"
      FWGS_BATCH_SIZE: "25"
      FWGS_FULL_CHUNK_LIMIT: "300"
      FWGS_FULL_OFFSETS: "0,300,600"
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      ENGINE_SNAPSHOT_ENCRYPTION_KEY: ${{ secrets.ENGINE_SNAPSHOT_ENCRYPTION_KEY }}
      BOURBON_SIGNAL_DISABLED_STATES: ${{ vars.BOURBON_SIGNAL_DISABLED_STATES }}
      BOURBON_SIGNAL_QUARANTINED_STATES: ${{ vars.BOURBON_SIGNAL_QUARANTINED_STATES }}
      BOURBON_SIGNAL_VA_REQUIRED_STORE_ID: ${{ inputs.va_required_store_id || '' }}
    steps:
      - name: Checkout current production engine
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci && npm --prefix engine ci

      - name: Validate Virginia required-store dispatch
        if: ${{ inputs.va_required_store_id != '' }}
        env:
          TARGET_STATES: ${{ inputs.states || '' }}
        run: |
          node -e "const states = String(process.env.TARGET_STATES || '').split(',').map((state) => state.trim().toUpperCase()).filter(Boolean); if (!states.includes('VA')) { console.error('va_required_store_id requires an explicit VA state target'); process.exit(1); }"

      - name: Preserve checked-in board shipment history bootstrap
        run: |
          mkdir -p "$RUNNER_TEMP/board-history-bootstrap"
          cp engine/out/site/drops.json "$RUNNER_TEMP/board-history-bootstrap/drops.json"

      - name: Restore collector artifacts and adaptive scheduler state
        uses: actions/cache/restore@v4
        with:
          path: |
            engine/out/browser
            engine/out/cache
            engine/out/states
            engine/out/snapshots
            engine/out/history/snapshots
            engine/out/location-bible-official.json
            engine/out/site-refresh-status.json
            engine/out/optimization/source-run-history.json
            engine/out/optimization/georgia-retailer-activation.json
            engine/out/optimization/state-run-metrics.json
          key: inventory-collector-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            inventory-collector-state-${{ runner.os }}-

      - name: Restore North Carolina board intelligence
        id: nc-intelligence-cache
        uses: actions/cache/restore@v4
        with:
          path: engine/out/nc-board-intelligence.json
          key: inventory-nc-board-intelligence-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            inventory-nc-board-intelligence-${{ runner.os }}-

      - name: Restore browser source artifacts
        uses: actions/cache/restore@v4
        with:
          path: engine/out/browser
          key: inventory-browser-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            inventory-browser-state-${{ runner.os }}-

      - name: Restore last published site contract
        uses: actions/cache/restore@v4
        with:
          path: engine/out/site
          key: inventory-published-site-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            inventory-published-site-${{ runner.os }}-

      - name: Restore checked-in board shipment history bootstrap
        run: |
          mkdir -p engine/out/historical-bootstrap
          cp "$RUNNER_TEMP/board-history-bootstrap/drops.json" engine/out/historical-bootstrap/drops.json

      - name: Hydrate complete state reports for recovery
        env:
          GH_TOKEN: ${{ github.token }}
          BOURBON_SIGNAL_RUN_STATES: ${{ inputs.states || '' }}
        run: node scripts/hydrate-state-reports.mjs

      - name: Verify expansion capacity and reliability policy
        working-directory: engine
        run: npm run verify:reliability

      - name: Refresh North Carolina official board and store directory
        if: ${{ !inputs.states || contains(inputs.states, 'NC') }}
        working-directory: engine
        env:
          BOURBON_SIGNAL_LOCATION_STATES: NC
        run: npm run location:bible

      - name: Refresh all due customer-active states
        working-directory: engine
        env:
          BOURBON_SIGNAL_STATE_SCHEDULER: ${{ inputs.force_all_states == 'true' && '0' || '1' }}
          BOURBON_SIGNAL_RUN_STATES: ${{ inputs.states || '' }}
          BOURBON_SIGNAL_BROWSER_REFRESH_MINUTES: ${{ contains(inputs.states, 'PA') && '0' || '240' }}
          BOURBON_SIGNAL_NY_FORCE_METRO_LIVE: ${{ contains(inputs.states, 'NY') && '1' || '0' }}
          BOURBON_SIGNAL_TN_FORCE_CITYHIVE_LIVE: ${{ contains(inputs.states, 'TN') && '1' || '0' }}
          BOURBON_SIGNAL_TN_CITYHIVE_FORCE_ALL_SOURCES: ${{ contains(inputs.states, 'TN') && '1' || '0' }}
          BOURBON_SIGNAL_SC_FORCE_CITYHIVE_LIVE: ${{ contains(inputs.states, 'SC') && '1' || '0' }}
          BOURBON_SIGNAL_SC_FORCE_ALL_AMERICAN_LIVE: ${{ contains(inputs.states, 'SC') && '1' || '0' }}
          BOURBON_SIGNAL_SC_FORCE_PHASE1_LIVE: ${{ contains(inputs.states, 'SC') && '1' || '0' }}
          BOURBON_SIGNAL_FORCE_SOURCE_RUN: ${{ (inputs.states != '' || inputs.force_all_states == 'true' || steps.nc-intelligence-cache.outputs.cache-matched-key == '') && '1' || '0' }}
          SC_CITYHIVE_SURF_PUBLIC_API_KEY: ${{ secrets.SC_CITYHIVE_SURF_PUBLIC_API_KEY }}
          SC_CITYHIVE_GREENS_PUBLIC_API_KEY: ${{ secrets.SC_CITYHIVE_GREENS_PUBLIC_API_KEY }}
          SC_CITYHIVE_BEACH_PUBLIC_API_KEY: ${{ secrets.SC_CITYHIVE_BEACH_PUBLIC_API_KEY }}
          SC_CITYHIVE_WINE_BARN_PUBLIC_API_KEY: ${{ secrets.SC_CITYHIVE_WINE_BARN_PUBLIC_API_KEY }}
          SC_CITYHIVE_ODARBYS_PUBLIC_API_KEY: ${{ secrets.SC_CITYHIVE_ODARBYS_PUBLIC_API_KEY }}
          SC_CITYHIVE_PALMETTO_PUBLIC_API_KEY: ${{ secrets.SC_CITYHIVE_PALMETTO_PUBLIC_API_KEY }}
          SC_CITYHIVE_DEV_PUBLIC_API_KEY: ${{ secrets.SC_CITYHIVE_DEV_PUBLIC_API_KEY }}
          SC_CITYHIVE_MOSS_CREEK_PUBLIC_API_KEY: ${{ secrets.SC_CITYHIVE_MOSS_CREEK_PUBLIC_API_KEY }}
          SC_CITYHIVE_ROLLERS_PUBLIC_API_KEY: ${{ secrets.SC_CITYHIVE_ROLLERS_PUBLIC_API_KEY }}
        run: npm run refresh:site

      - name: Verify North Carolina scheduled continuity or isolate a safe partial fallback
        if: ${{ !inputs.states }}
        working-directory: engine
        run: npm run verify:nc -- --allow-safe-partial-fallback

      - name: Verify North Carolina targeted recovery strictly
        if: ${{ inputs.states && contains(inputs.states, 'NC') }}
        working-directory: engine
        run: npm run verify:nc

      - name: Verify North Carolina official directory publication
        if: ${{ !inputs.states || contains(inputs.states, 'NC') }}
        working-directory: engine
        run: npm run verify:nc-directory

      - name: Verify coherent site contract
        working-directory: engine
        run: npm run verify:site

      - name: Verify targeted South Carolina All American inventory
        if: ${{ inputs.states && contains(inputs.states, 'SC') }}
        working-directory: engine
        run: npm run verify:sc-all-american

      - name: Verify complete targeted South Carolina inventory
        if: ${{ inputs.states && contains(inputs.states, 'SC') }}
        working-directory: engine
        run: npm run verify:sc

      - name: Verify Georgia scheduled lane or isolate an explicit last-known fallback
        if: ${{ !inputs.states }}
        working-directory: engine
        run: npm run verify:ga -- --allow-labeled-last-known-fallback

      - name: Verify Georgia targeted private-retailer recovery
        if: ${{ inputs.states && contains(inputs.states, 'GA') }}
        working-directory: engine
        run: npm run verify:ga

      - name: Verify Virginia scheduled lane or isolate a safe stale fallback
        if: ${{ !inputs.states }}
        working-directory: engine
        run: npm run verify:va -- --allow-safe-stale-fallback

      - name: Verify Virginia targeted statewide live inventory recovery
        if: ${{ inputs.states && contains(inputs.states, 'VA') }}
        working-directory: engine
        run: npm run verify:va

      - name: Verify Pennsylvania scheduled lane or isolate a safe stale fallback
        if: ${{ !inputs.states }}
        working-directory: engine
        run: npm run verify:pa -- --allow-safe-stale-fallback

      - name: Verify Pennsylvania targeted exact-store recovery
        if: ${{ inputs.states && contains(inputs.states, 'PA') }}
        working-directory: engine
        run: npm run verify:pa

      - name: Verify Florida scheduled lane with guarded current inventory and safe fallback
        if: ${{ !inputs.states }}
        working-directory: engine
        run: npm run verify:fl -- --allow-safe-stale-fallback

      - name: Verify Florida targeted statewide exact-store expansion
        if: ${{ inputs.states && contains(inputs.states, 'FL') }}
        working-directory: engine
        run: npm run verify:fl

      - name: Verify no unproven state promotion entered the customer path
        working-directory: engine
        run: npm run verify:state-integration -- --all-active

      - name: Verify California scheduled lane or isolate a safe retained partition
        if: ${{ !inputs.states }}
        working-directory: engine
        run: npm run verify:ca -- --allow-safe-retained-not-due

      - name: Verify California targeted exact-store recovery
        if: ${{ inputs.states && contains(inputs.states, 'CA') }}
        working-directory: engine
        run: npm run verify:ca

      - name: Verify demand metro generated evidence with fresh retained fallback
        if: ${{ !inputs.states }}
        working-directory: engine
        run: npm run verify:demand-metros -- --allow-fresh-retained-evidence --allow-safe-stale-fallback

      - name: Verify demand metro generated evidence for targeted Tennessee
        if: ${{ inputs.states && contains(inputs.states, 'TN') }}
        working-directory: engine
        run: npm run verify:demand-metros

      - name: Verify Tennessee generated contract with fresh retained fallback
        if: ${{ !inputs.states }}
        working-directory: engine
        run: npm run verify:tn -- --allow-fresh-retained-evidence --allow-scheduled-partial-evidence --allow-safe-stale-fallback

      - name: Verify Tennessee generated contract for targeted recovery
        if: ${{ inputs.states && contains(inputs.states, 'TN') }}
        working-directory: engine
        run: npm run verify:tn -- --targeted-cohort

      - name: Verify degraded state isolation before publication
        working-directory: engine
        run: npm run verify:state-isolation

      - name: Refuse publication from a stale main checkout
        id: release-guard
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "sha_mismatch=false" >> "$GITHUB_OUTPUT"
          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main_sha" != "$GITHUB_SHA" ]]; then
            echo "sha_mismatch=true" >> "$GITHUB_OUTPUT"
          fi
          node scripts/verify-release-lane.mjs --phase=publish

      - name: Dispatch replacement refresh from current main
        if: ${{ steps.release-guard.outputs.sha_mismatch == 'true' && !startsWith(inputs.incident_key, 'superseded-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          incident_key="superseded-${GITHUB_SHA:0:20}"
          gh workflow run refresh-feed.yml --ref main -f force_all_states=true -f incident_key="$incident_key"

      - name: Fail refresh rejected by release guard
        if: steps.release-guard.outcome == 'failure'
        run: exit 1

      - name: Publish and atomically activate encrypted snapshot
        id: publish
        working-directory: engine
        run: node src/data-plane/publish-site-snapshot.mjs --site-dir out/site

      - name: Verify publication authority after activation
        id: authority
        if: ${{ always() && steps.publish.outputs.snapshot_id != '' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-lane.mjs --phase=publish

      - name: Roll back only this snapshot if publication failed or authority was superseded
        if: ${{ always() && steps.publish.outputs.snapshot_id != '' && (steps.publish.outcome == 'failure' || steps.authority.outcome == 'failure') }}
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node engine/src/data-plane/publish-site-snapshot.mjs --rollback-if-active "${{ steps.publish.outputs.snapshot_id }}"

      - name: Fail after guarded publication rollback
        if: ${{ always() && steps.publish.outputs.snapshot_id != '' && (steps.publish.outcome == 'failure' || steps.authority.outcome == 'failure') }}
        run: exit 1

      - name: Verify production observes the refreshed engine or roll back
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BOURBON_SIGNAL_VERIFY_STATES: ${{ inputs.states || '' }}
        run: |
          if ! npm run verify:production-engine; then
            node engine/src/data-plane/publish-site-snapshot.mjs --rollback-if-active "${{ steps.publish.outputs.snapshot_id }}"
            exit 1
          fi

      - name: Save verified collector state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            engine/out/browser
            engine/out/cache
            engine/out/states
            engine/out/snapshots
            engine/out/history/snapshots
            engine/out/location-bible-official.json
            engine/out/site-refresh-status.json
            engine/out/optimization/source-run-history.json
            engine/out/optimization/georgia-retailer-activation.json
            engine/out/optimization/state-run-metrics.json
          key: inventory-collector-state-${{ runner.os }}-${{ github.run_id }}

      - name: Save verified North Carolina board intelligence
        if: success()
        uses: actions/cache/save@v4
        with:
          path: engine/out/nc-board-intelligence.json
          key: inventory-nc-board-intelligence-${{ runner.os }}-${{ github.run_id }}

      - name: Save browser source artifacts
        if: always()
        uses: actions/cache/save@v4
        with:
          path: engine/out/browser
          key: inventory-browser-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save verified published site contract
        if: success()
        uses: actions/cache/save@v4
        with:
          path: engine/out/site
          key: inventory-published-site-${{ runner.os }}-${{ github.run_id }}

      - name: Preserve refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-refresh-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            engine/out/site-refresh-status.json
            engine/out/reliability-status.json
            engine/out/source-health.json
            engine/out/operational-report.json
            engine/out/source-slo-7d.json
            engine/out/source-slo-7d.md
            engine/out/source-usefulness-roi.json
            engine/out/source-usefulness-roi.md
            engine/out/nc-board-intelligence.json
            engine/out/site/stats.json
            engine/out/optimization/source-run-history.json
            engine/out/optimization/georgia-retailer-activation.json
            engine/out/optimization/state-run-metrics.json
            engine/out/states/*.json
