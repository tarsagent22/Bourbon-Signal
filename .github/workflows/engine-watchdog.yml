name: Production engine freshness watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: production-engine-watchdog
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BOURBON_SIGNAL_AUTO_RECOVERY_ENABLED: ${{ vars.BOURBON_SIGNAL_AUTO_RECOVERY_ENABLED || '1' }}
    steps:
      - name: Checkout watchdog contract
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Probe the customer domain twice
        id: watchdog
        continue-on-error: true
        env:
          BOURBON_SIGNAL_WATCHDOG_ATTEMPTS: "2"
          BOURBON_SIGNAL_WATCHDOG_RETRY_DELAY_MS: "15000"
          BOURBON_SIGNAL_WATCHDOG_MAX_SNAPSHOT_AGE_MS: "2700000"
        run: node scripts/production-engine-watchdog.mjs

      - name: Preserve watchdog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-engine-watchdog-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: engine/out/production-watchdog.json

      - name: Plan guarded recovery without redispatching an unchanged failure
        id: recovery-plan
        if: steps.watchdog.outcome == 'failure' && env.BOURBON_SIGNAL_AUTO_RECOVERY_ENABLED != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow refresh-feed.yml --limit 10 --json databaseId,event,status,conclusion,headSha,createdAt,displayTitle > active-refresh-runs.json
          gh run list --workflow refresh-feed.yml --event workflow_dispatch --limit 100 --json databaseId,event,status,conclusion,headSha,createdAt,displayTitle > recovery-attempts.json
          node -e "const fs=require('fs');const active=JSON.parse(fs.readFileSync('active-refresh-runs.json','utf8')).filter(r=>r.status==='queued'||r.status==='in_progress');const attempts=JSON.parse(fs.readFileSync('recovery-attempts.json','utf8'));fs.writeFileSync('recent-refresh-runs.json',JSON.stringify([...active,...attempts]));"
          node scripts/engine-recovery-dispatch-plan.mjs --watchdog engine/out/production-watchdog.json --runs recent-refresh-runs.json --head-sha "$GITHUB_SHA" > recovery-plan.json
          echo "dispatch=$(node -e "const p=require('./recovery-plan.json');process.stdout.write(String(p.dispatch))")" >> "$GITHUB_OUTPUT"
          echo "mode=$(node -e "const p=require('./recovery-plan.json');process.stdout.write(p.mode)")" >> "$GITHUB_OUTPUT"
          echo "recovery_states=$(node -e "const p=require('./recovery-plan.json');process.stdout.write((p.states||[]).join(','))")" >> "$GITHUB_OUTPUT"
          echo "reason=$(node -e "const p=require('./recovery-plan.json');process.stdout.write(p.reason)")" >> "$GITHUB_OUTPUT"
          echo "incident_key=$(node -e "const p=require('./recovery-plan.json');process.stdout.write(p.incidentKey)")" >> "$GITHUB_OUTPUT"
          echo "attempt=$(node -e "const p=require('./recovery-plan.json');process.stdout.write(String(p.attempt||''))")" >> "$GITHUB_OUTPUT"

      - name: Dispatch guarded recovery after two failed probes
        id: recovery
        continue-on-error: true
        if: steps.recovery-plan.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          recovery_states="${{ steps.recovery-plan.outputs.recovery_states }}"
          if [ -n "$recovery_states" ]; then
            gh workflow run refresh-feed.yml --ref main -f states="$recovery_states" -f incident_key="${{ steps.recovery-plan.outputs.incident_key }}"
            echo "State coverage collapse detected; targeted recovery dispatched for $recovery_states."
          else
            gh workflow run refresh-feed.yml --ref main -f force_all_states=true -f incident_key="${{ steps.recovery-plan.outputs.incident_key }}"
            echo "Stale or incoherent snapshot detected; guarded full recovery dispatched."
          fi

      - name: Record recovery dispatch
        if: steps.watchdog.outcome == 'failure' && steps.recovery.outcome == 'success'
        run: echo "::warning title=Production recovery dispatched::The customer-domain freshness probe is still failed. Recovery was dispatched but has not yet been verified."

      - name: Record suppressed duplicate recovery
        if: steps.watchdog.outcome == 'failure' && steps.recovery-plan.outcome == 'success' && steps.recovery-plan.outputs.dispatch != 'true'
        run: echo "::warning title=Production recovery suppressed::The customer-domain freshness probe is still failed. Guarded recovery was withheld because ${{ steps.recovery-plan.outputs.reason }} for incident ${{ steps.recovery-plan.outputs.incident_key }}."

      - name: Escalate unresolved production freshness
        if: steps.watchdog.outcome == 'failure'
        run: |
          echo "Production freshness remains outside the SLO. Recovery dispatch or deduplication does not count as restoration."
          exit 1
