name: Production engine freshness watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: production-engine-watchdog
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BOURBON_SIGNAL_AUTO_RECOVERY_ENABLED: ${{ vars.BOURBON_SIGNAL_AUTO_RECOVERY_ENABLED || '1' }}
    steps:
      - name: Checkout watchdog contract
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Probe the customer domain twice
        id: watchdog
        continue-on-error: true
        env:
          BOURBON_SIGNAL_WATCHDOG_ATTEMPTS: "2"
          BOURBON_SIGNAL_WATCHDOG_RETRY_DELAY_MS: "15000"
          BOURBON_SIGNAL_WATCHDOG_MAX_SNAPSHOT_AGE_MS: "2700000"
        run: node scripts/production-engine-watchdog.mjs

      - name: Preserve watchdog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-engine-watchdog-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: engine/out/production-watchdog.json

      - name: Dispatch guarded recovery after two failed probes
        id: recovery
        continue-on-error: true
        if: steps.watchdog.outcome == 'failure' && env.BOURBON_SIGNAL_AUTO_RECOVERY_ENABLED != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          recovery_states="$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('engine/out/production-watchdog.json','utf8'));process.stdout.write((p.recoveryStates||[]).join(','))")"
          active_runs="$(gh run list --workflow refresh-feed.yml --limit 10 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')"
          if [ "$active_runs" -eq 0 ]; then
            if [ -n "$recovery_states" ]; then
              gh workflow run refresh-feed.yml --ref main -f states="$recovery_states"
              echo "State coverage collapse detected; targeted recovery dispatched for $recovery_states."
            else
              gh workflow run refresh-feed.yml --ref main -f force_all_states=true
              echo "Stale or incoherent snapshot detected; guarded full recovery dispatched."
            fi
          else
            echo "A guarded refresh is already active; suppressing duplicate recovery dispatch."
          fi

      - name: Record self-healing stale snapshot
        if: steps.watchdog.outcome == 'failure' && steps.recovery.outcome == 'success'
        run: echo "::warning title=Production snapshot recovery in progress::The watchdog detected stale data and automatic recovery is active. This is a handled condition, not a failed workflow run."

      - name: Escalate only if automatic recovery fails or is disabled
        if: steps.watchdog.outcome == 'failure' && (steps.recovery.outcome == 'failure' || env.BOURBON_SIGNAL_AUTO_RECOVERY_ENABLED == '0')
        run: |
          echo "Production freshness is outside the SLO and automatic recovery is unavailable."
          exit 1
