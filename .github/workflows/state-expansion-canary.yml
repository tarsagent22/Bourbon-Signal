name: State expansion canary preview

on:
  workflow_dispatch:
    inputs:
      state:
        description: "Non-active state ID with manifest, fixtures, and shadow evidence"
        required: true
        type: string
      shadow_run_id:
        description: "OR/WA/NM/WI/OK/NJ/MI/AK/LA/RI/CT: successful workflow-issued shadow run to replay with original clocks"
        required: false
        type: string
      candidate_drops:
        description: "Engine-relative JSON file containing normalized candidate site drops"
        required: true
        type: string
      deploy_preview:
        description: "Deploy the isolated Vercel preview after local checks"
        required: false
        default: false
        type: boolean

concurrency:
  group: state-expansion-canary-${{ inputs.state }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  build-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOURBON_SIGNAL_AUTO_DEPLOY: "0"
      BOURBON_SIGNAL_ALERT_QUEUE_MODE: shadow
      ALERT_DELIVERY_ENABLED: "0"
      ALERT_ONSITE_DELIVERY_ENABLED: "0"
      ALERT_EMAIL_DELIVERY_ENABLED: "0"
      ALERT_SMS_DELIVERY_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci && npm ci --prefix engine

      - name: Validate untrusted dispatch inputs
        id: validate
        env:
          RAW_STATE: ${{ inputs.state }}
          RAW_CANDIDATE_DROPS: ${{ inputs.candidate_drops }}
          RAW_SHADOW_RUN: ${{ inputs.shadow_run_id }}
        run: |
          if [[ ! "$RAW_STATE" =~ ^([A-Z]{2}|MD-MONTGOMERY)$ ]]; then
            echo "Invalid state input" >&2
            exit 1
          fi
          if [[ ! "$RAW_CANDIDATE_DROPS" =~ ^data/canary-inputs/[A-Za-z0-9._/-]+\.json$ ]] || [[ "$RAW_CANDIDATE_DROPS" == *".."* ]]; then
            echo "Candidate path must be a repository-controlled engine/data/canary-inputs JSON file" >&2
            exit 1
          fi
          if [[ "$RAW_STATE" == "OR" || "$RAW_STATE" == "WA" || "$RAW_STATE" == "NM" || "$RAW_STATE" == "WI" || "$RAW_STATE" == "OK" || "$RAW_STATE" == "NJ" || "$RAW_STATE" == "MI" || "$RAW_STATE" == "AK" || "$RAW_STATE" == "LA" || "$RAW_STATE" == "RI" || "$RAW_STATE" == "CT" ]]; then
            if [[ ! "$RAW_SHADOW_RUN" =~ ^[0-9]+$ ]] || [[ "$RAW_CANDIDATE_DROPS" != "data/canary-inputs/$RAW_STATE.json" ]]; then
              echo "OR/WA/NM/WI/OK/NJ/MI/AK/LA/RI/CT require an actual shadow run and the fixed state canary path" >&2
              exit 1
            fi
          elif [[ -n "$RAW_SHADOW_RUN" ]]; then
            echo "Artifact replay is reviewed only for OR/WA/NM/WI/OK/NJ/MI/AK/LA/RI/CT" >&2
            exit 1
          fi
          echo "shadow_run=$RAW_SHADOW_RUN" >> "$GITHUB_OUTPUT"
          echo "state=$RAW_STATE" >> "$GITHUB_OUTPUT"
          echo "candidate_drops=$RAW_CANDIDATE_DROPS" >> "$GITHUB_OUTPUT"

      - name: Restore last accepted published baseline for isolated preview
        uses: actions/cache/restore@v4
        with:
          path: engine/out/site
          key: inventory-published-site-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            inventory-published-site-${{ runner.os }}-

      - name: Require a coherent published baseline
        run: |
          test -s engine/out/site/manifest.json
          test -s engine/out/site/stats.json
          test -s engine/out/site/drops.json
          test -s engine/out/site/states/index.json

      - name: Refresh current app library and build Bible
        working-directory: engine
        env:
          BOURBON_SIGNAL_LIBRARY_CATALOG_FILE: out/library-catalog.json
        run: npm run sync:library && npm run bible

      - name: Verify and download workflow-issued first-party shadow artifact
        if: steps.validate.outputs.shadow_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.validate.outputs.state }}
          SHADOW_RUN: ${{ steps.validate.outputs.shadow_run }}
        run: |
          case "$STATE" in OR) node scripts/download-oregon-shadow.mjs --run="$SHADOW_RUN" --out-dir="engine/out/oregon-shadow-input/OR" ;; AK|LA) node scripts/download-laak-shadow.mjs --state="$STATE" --run="$SHADOW_RUN" --out-dir="engine/out/laak-shadow-input/$STATE" ;; NJ|MI) node scripts/download-njmi-shadow.mjs --state="$STATE" --run="$SHADOW_RUN" --out-dir="engine/out/njmi-shadow-input/$STATE" ;; WI|OK|RI|CT) node scripts/download-cityhive-shadow.mjs --state="$STATE" --run="$SHADOW_RUN" --out-dir="engine/out/cityhive-shadow-input/$STATE" ;; WA|NM) node scripts/download-grocery-shadow.mjs --state="$STATE" --run="$SHADOW_RUN" --out-dir="engine/out/grocery-shadow-input/$STATE" ;; *) exit 1 ;; esac

      - name: Reparse immutable raw source captures without resetting clocks
        if: steps.validate.outputs.shadow_run != ''
        working-directory: engine
        env:
          STATE: ${{ steps.validate.outputs.state }}
        run: |
          case "$STATE" in OR) node src/prepare-oregon-canary.mjs --artifact-dir=out/oregon-shadow-input/OR --provenance=out/oregon-shadow-input/OR/provenance.json --out=data/canary-inputs/OR.json --config-out=out/canary-preparation/OR/lifecycle-research.json ;; AK|LA) node src/prepare-laak-canary.mjs --state="$STATE" --artifact-dir="out/laak-shadow-input/$STATE/extracted" --provenance="out/laak-shadow-input/$STATE/provenance.json" --out="data/canary-inputs/$STATE.json" --config-out="out/canary-preparation/$STATE/lifecycle-research.json" ;; NJ|MI) family=njmi; preparer=prepare-nj-mi-canary.mjs ;; WI|OK|RI|CT) family=cityhive; preparer=prepare-central-cityhive-canary.mjs ;; WA|NM) family=grocery; preparer=prepare-grocery-canary.mjs ;; *) exit 1 ;; esac
          if [[ "$STATE" != "OR" && "$STATE" != "AK" && "$STATE" != "LA" ]]; then node "src/$preparer" --state="$STATE" --artifact-dir="out/$family-shadow-input/$STATE/extracted" --provenance="out/$family-shadow-input/$STATE/provenance.json" --out="data/canary-inputs/$STATE.json" --config-out="out/canary-preparation/$STATE/lifecycle-research.json"; fi

      - name: Build coherent nationwide canary snapshot without alerts
        working-directory: engine
        env:
          STATE: ${{ steps.validate.outputs.state }}
          CANDIDATE_DROPS: ${{ steps.validate.outputs.candidate_drops }}
          SHADOW_RUN: ${{ steps.validate.outputs.shadow_run }}
        run: |
          config_args=()
          if [[ -n "$SHADOW_RUN" ]]; then config_args+=("--config=out/canary-preparation/$STATE/lifecycle-research.json"); fi
          npm run canary:state -- --state="$STATE" --candidate-drops="$CANDIDATE_DROPS" --out-dir="out/canary/$STATE/site" "${config_args[@]}"

      - name: Verify candidate golden fixture contract
        working-directory: engine
        env:
          STATE: ${{ steps.validate.outputs.state }}
        run: npm run verify:state-fixtures -- --state="$STATE" --canary

      - name: Verify candidate vertical slice against canary snapshot
        working-directory: engine
        env:
          STATE: ${{ steps.validate.outputs.state }}
        run: npm run verify:state-integration -- --canary --state="$STATE" --site-dir="out/canary/$STATE/site" --config="out/canary/$STATE/site/lifecycle-preview.json"

      - name: Verify actual app projection and binary on-site isolation
        if: steps.validate.outputs.shadow_run != ''
        env:
          STATE: ${{ steps.validate.outputs.state }}
        run: |
          case "$STATE" in OR) verifier=test-oregon-public-canary.mjs ;; AK|LA) verifier=test-laak-public-canary.mjs ;; NJ|MI) verifier=test-nj-mi-public-canary.mjs ;; WI|OK|RI|CT) verifier=test-central-cityhive-public-canary.mjs ;; WA|NM) verifier=test-grocery-public-canary.mjs ;; *) exit 1 ;; esac
          node --import tsx "scripts/$verifier" --state="$STATE"

      - name: Deploy isolated preview with all alert channels disabled
        if: inputs.deploy_preview == true
        id: preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STATE: ${{ steps.validate.outputs.state }}
        run: |
          cp "engine/out/canary/$STATE/site/lifecycle-preview.json" src/config/state-lifecycle.json
          node scripts/generate-state-lifecycle-types.mjs
          rm -rf engine/out/site
          cp -R "engine/out/canary/$STATE/site" engine/out/site
          cp -R "engine/out/canary/$STATE/site" canary-site-export
          preview_url="$(npx vercel deploy --yes --token "$VERCEL_TOKEN" --build-env BOURBON_SIGNAL_CANARY_PREVIEW=1 --build-env ENGINE_SNAPSHOT_READ_MODE=off --build-env ALERT_DELIVERY_ENABLED=0 --build-env ALERT_ONSITE_DELIVERY_ENABLED=0 --build-env ALERT_EMAIL_DELIVERY_ENABLED=0 --build-env ALERT_SMS_DELIVERY_ENABLED=0 --build-env BOURBON_SIGNAL_ALERT_QUEUE_MODE=shadow --env BOURBON_SIGNAL_CANARY_PREVIEW=1 --env ENGINE_SNAPSHOT_READ_MODE=off --env ALERT_DELIVERY_ENABLED=0 --env ALERT_ONSITE_DELIVERY_ENABLED=0 --env ALERT_EMAIL_DELIVERY_ENABLED=0 --env ALERT_SMS_DELIVERY_ENABLED=0 --env BOURBON_SIGNAL_ALERT_QUEUE_MODE=shadow)"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "Isolated preview deployed: $preview_url"

      - name: Exercise Utah customer-facing preview routes
        if: inputs.deploy_preview == true && steps.validate.outputs.state == 'UT'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: node scripts/test-utah-live-user-path.mjs "$PREVIEW_URL"

      - name: Preserve canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-expansion-canary-${{ steps.validate.outputs.state }}-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            engine/out/canary/${{ steps.validate.outputs.state }}
            engine/out/grocery-shadow-input/${{ steps.validate.outputs.state }}/provenance.json
            engine/out/cityhive-shadow-input/${{ steps.validate.outputs.state }}/provenance.json
            engine/out/njmi-shadow-input/${{ steps.validate.outputs.state }}/provenance.json
            engine/out/oregon-shadow-input/${{ steps.validate.outputs.state }}
            engine/out/laak-shadow-input/${{ steps.validate.outputs.state }}
            engine/out/canary-preparation/${{ steps.validate.outputs.state }}
            engine/data/canary-inputs/${{ steps.validate.outputs.state }}.json
            engine/out/library-catalog.json
            engine/out/bourbon-bible.json
