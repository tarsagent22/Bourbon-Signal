name: Native iOS startup
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ios-startup.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: native-ios-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  startup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 15
    env:
      CI: '1'
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Temporary incident-only reuse; not a permanent release-readiness gate.
      # Native dependencies are unchanged from this exact archived simulator shell.
      - name: Retrieve the already-tested native shell
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '34005474222'
          name: native-ios-startup-3f02e40552f2e4b0ff0846fe6ddc7d604fab3b93
          path: apps/mobile/native-evidence
      - name: Restore native shell
        run: |
          mkdir -p native-evidence/build/Build/Products/Release-iphonesimulator
          tar -xzf native-evidence/simulator-app.tar.gz -C native-evidence/build/Build/Products/Release-iphonesimulator
      - name: Export real Home with only synthetic API and auth seams
        run: |
          node -e "require('node:fs').writeFileSync('metro.config.js',\"module.exports = require('./scripts/native-home/metro.config.cjs');\\n\")"
          trap 'rm -f metro.config.js' EXIT
          npx expo export:embed --entry-file scripts/native-home/entry.tsx --platform ios --dev false --bytecode --bundle-output native-evidence/build/Build/Products/Release-iphonesimulator/BourbonSignal.app/main.jsbundle --sourcemap-output native-evidence/home-fixture.map
      - name: Run native Home fixture
        env:
          NATIVE_SCENARIO: home-fixture
        run: python3 scripts/verify-ios-startup.py
      - name: Preserve actual native Home evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-home-fixture-${{ github.event.pull_request.head.sha }}
          path: apps/mobile/native-evidence/home-fixture/
          retention-days: 7
