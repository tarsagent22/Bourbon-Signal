name: Native iOS startup
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ios-startup.yml'
permissions:
  contents: read
concurrency:
  group: native-ios-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  startup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 40
    env:
      CI: '1'
      EXPO_PUBLIC_API_URL: https://www.bourbonsignal.com
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NATIVE_SMOKE_CLERK_PUBLISHABLE_KEY }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Fetch the exact two incident OTA bundles
        env:
          NATIVE_INCIDENT_ASSETS: ${{ secrets.NATIVE_SMOKE_INCIDENT_ASSETS }}
        run: python3 scripts/fetch-incident-ios-bundles.py
      - run: npm ci --no-audit --no-fund
      - name: Adapt build-tool parser to locked secure xmldom API
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require.resolve('@expo/plist/build/parse');
          const source = fs.readFileSync(path, 'utf8');
          const before = '.parseFromString(xml)';
          if (!source.includes(before)) throw new Error('Unexpected plist parser; reassess compatibility shim');
          fs.writeFileSync(path, source.replace(before, '.parseFromString(xml.trimStart(), "text/xml")'));
          const plist = require('@expo/plist').default;
          if (plist.parse('<plist><dict><key>ready</key><true/></dict></plist>').ready !== true) throw new Error('Plist parser failed');
          NODE
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install pods
        run: pod install --project-directory=ios
      - name: Compile actual Release app for simulator
        run: |
          mkdir -p native-evidence
          set -o pipefail
          xcodebuild -workspace ios/BourbonSignal.xcworkspace -scheme BourbonSignal -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath native-evidence/build CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES ARCHS="$(uname -m)" build > native-evidence/build.log 2>&1
      - name: Archive simulator shell for bounded follow-up tests
        run: tar -czf native-evidence/simulator-app.tar.gz -C native-evidence/build/Build/Products/Release-iphonesimulator BourbonSignal.app
      - name: Compare embedded and exact incident OTA bundles
        run: python3 scripts/compare-ios-bundles.py
      - name: Preserve native startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-startup-${{ github.event.pull_request.head.sha }}
          path: |
            apps/mobile/native-evidence/*.log
            apps/mobile/native-evidence/*.json
            apps/mobile/native-evidence/*.tar.gz
            apps/mobile/native-evidence/*/*.log
            apps/mobile/native-evidence/*/*.json
            apps/mobile/native-evidence/*/*.png
            apps/mobile/native-evidence/*/*.ips
            apps/mobile/native-evidence/bundles/*.hbc
          retention-days: 7
