plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.bourbonsignal.labels'
version = '1.0.0'

android {
  namespace 'com.bourbonsignal.labels'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }
}

dependencies {
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
  // Bundled Latin model: label reading does not wait for a model download.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  // Match the CameraX version already used by Expo Camera in SDK 57.
  implementation 'androidx.camera:camera-camera2:1.6.0'
  implementation 'androidx.camera:camera-lifecycle:1.6.0'
  implementation 'androidx.camera:camera-view:1.6.0'
}

configurations.configureEach {
  if (name.contains('AndroidTest')) {
    // Instrumentation includes Guava, which already defines ListenableFuture.
    exclude group: 'com.google.guava', module: 'listenablefuture'
  } else {
    resolutionStrategy.force 'com.google.guava:listenablefuture:1.0'
  }
}
