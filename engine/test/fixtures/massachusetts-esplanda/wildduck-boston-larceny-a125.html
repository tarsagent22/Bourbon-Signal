<script type="application/ld+json">[{"@context":"https://schema.org/","@type":"Product","@id":"https://www.wildduckliquors.com/product/batch-a125-barrel-proof-larceny/58473173#product","productID":"6e487b00-125d-11ec-a49f-afb034be823e","name":"Larceny Batch A125 Barrel Proof","description":"Larceny Batch A125 Barrel Proof (750 ML) is $59.99 at The Wild Duck Liquor Store in Boston, Massachusetts — in stock now for pickup, delivery or shipping. Larceny Batch A125 is a barrel-proof Kentucky bourbon bottled at 57.7% ABV without being cut down to a standard proof. The reference material describes it as unfiltered. Larceny is a wheated bourbon, meaning wheat replaces rye as the secondary grain. That choice usually gives a softer, rounder profile than a rye-forward recipe. The \"A125\" batch code marks this as one release in a series, and barrel-proof bourbons can vary a little from batch to batch, so treat the notes below as what to expect from the style. At this strength, expect a dense nose of caramel, vanilla and toasted oak. Wheated bourbons often add baked bread, honey or soft fruit, with a hint of baking spice behind them. On the palate, the wheat tends to cushion the heat. You should still get a warm, peppery finish and a lingering char-and-oak dryness that fits the high proof. For neat sipping, pour a small measure into a Glencairn. The tapered bowl concentrates the aromas, and at nearly 58% ABV you will want to nose it gently with your mouth slightly open. A few drops of room-temperature water often loosen the spirit. They lower the alcohol sting and tend to bring forward the vanilla, fruit and grain character. If you prefer it colder, a single large cube in a rocks glass dilutes slowly and keeps the sweetness intact. Several small ice cubes will water it down much faster. The proof is an advantage in mixed drinks because the bourbon holds its flavor against sugar, bitters and ice. An Old Fashioned is the natural choice. Use a small measure of rich demerara syrup, two dashes of Angostura and an orange peel, and stir over a large cube. In a Manhattan, the wheat softness pairs well with sweet vermouth, and you will probably want a little less vermouth than usual so the bourbon stays at the front. A Whiskey Sour with fresh lemon and a touch of egg white handles the strength without tasting thin. For a Highball, use about 1.5 ounces over ice with cold soda water and a lemon twist. Keep the pour modest, as the high proof carries through even when diluted.","url":"https://www.wildduckliquors.com/product/batch-a125-barrel-proof-larceny/58473173","image":["https://d36musakzcdau7.cloudfront.net/esplanda/Product/6e487b00-125d-11ec-a49f-afb034be823e/larceny-batch-a125-barrel-proof-750ml.webp"],"brand":{"@type":"Brand","name":"Larceny"},"sku":"09674900265","additionalProperty":[{"@type":"PropertyValue","name":"Alcohol by volume","value":57.7,"unitCode":"P1","unitText":"%"},{"@type":"PropertyValue","name":"Region","value":"Kentucky, USA"},{"@type":"PropertyValue","name":"Volume","value":750,"unitCode":"MLT","unitText":"ml"}],"countryOfOrigin":{"@type":"Country","name":"United States"},"offers":[{"@type":"Offer","price":"59.99","priceCurrency":"USD","itemCondition":"https://schema.org/NewCondition","availability":"https://schema.org/InStock","availableAtOrFrom":{"@id":"https://www.wildduckliquors.com/#store"},"hasMerchantReturnPolicy":{"@type":"MerchantReturnPolicy","applicableCountry":"US","returnPolicyCategory":"https://schema.org/MerchantReturnNotPermitted"},"sku":"09674900265","url":"https://www.wildduckliquors.com/product/batch-a125-barrel-proof-larceny/58473173?format=59718141"}]},{"@type":"LiquorStore","@id":"https://www.wildduckliquors.com/#store","name":"The Wild Duck Liquor Store","url":"https://www.wildduckliquors.com","description":"A Liquor Store, Food, Market, and Modern shop in Back Bay, Boston, MA.(same block) In our market, we carry a wide variety of locally sourced, fresh produce and organic foods. We have vegan, gluten
